# Deploy the Oxy Pay Gateway backend (@oxypay/backend) to AWS ECS Fargate.
#
# Adapted from the canonical Mention backend workflow. Builds a native arm64
# image on an arm64 runner, pushes it to ECR, and rolls the ECS service. The
# ECR repo (oxy/oxypay) and the ECS service (oxypay on cluster oxy-cluster,
# port 3001) are provisioned in terraform (~/Oxy/oxy-infra); the deploy step
# no-ops gracefully until the service exists, so the first push can run before
# the service is created (the image still lands in ECR).
name: Deploy to AWS

on:
  push:
    branches: [main]
    # The backend image bundles shared-types and the root manifests, so a change
    # to any of them must trigger a redeploy — not just packages/backend/**.
    paths:
      - 'packages/backend/**'
      - 'packages/shared-types/**'
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - '.github/workflows/deploy-aws.yml'
  workflow_dispatch:
    inputs:
      migration_phase:
        description: 'Migration run. Leave as pre-post for a normal release; `all` is the from-zero genesis / cutover only.'
        required: false
        default: pre-post
        type: choice
        options: [pre-post, all]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-west-2
  ECR_REGISTRY: 237343248947.dkr.ecr.us-west-2.amazonaws.com
  APP: oxypay
  CLUSTER: oxy-cluster
  DOCKERFILE: packages/backend/Dockerfile
  # The database the migrator is allowed to write DDL to. Checked against
  # `current_database()` by `--target-database`, so a task whose DATABASE_URL
  # reaches somewhere else fails instead of migrating it — a migrator pointed at
  # the wrong database does not error, it finds an empty ledger, applies the
  # whole journal and reports success over a database nobody meant to touch.
  PG_DATABASE: oxypay

jobs:
  deploy:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6
        with:
          role-to-assume: arn:aws:iam::237343248947:role/oxy-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      # The secrets are enumerated one at a time, on purpose.
      #
      # The allowlist below already existed, but the VALUES still came from
      # `toJSON(secrets)`, and it is that expression which holds deploys: a
      # workflow that walks every repository secret into a shell loop is shaped
      # exactly like an exfiltration payload, so GitHub creates the run with
      # conclusion `action_required` and ZERO jobs until a human clicks
      # "Approve and run" in the UI. The REST approve endpoint only serves fork
      # pull requests, so it cannot be automated, and the approval is per run —
      # every deploy needs a person. Filtering the blob after the fact does not
      # help; the blob must never be built.
      #
      # The list is the secrets the `oxypay` task definition actually consumes.
      # Adding a new one means adding it here, or it never reaches SSM.
      - name: Sync GitHub secrets -> SSM (GitHub is the source of truth)
        env:
          # Read by packages/backend/src/config.ts (`loadConfig`).
          APP_MONGODB_URI: ${{ secrets.MONGODB_URI }}
          # The Postgres connection string. Currently read by the migrator and
          # by `db/postgres.ts`, which nothing calls at boot — the routes are
          # still on Mongo. It is synced now so the parameter is in place before
          # the change that makes it required. An unset or placeholder GitHub
          # secret is SKIPPED by sync_secret below, so adding this line cannot
          # overwrite a value provisioned directly in SSM.
          APP_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_OXY_ACCESS_TOKEN_SECRET: ${{ secrets.OXY_ACCESS_TOKEN_SECRET }}
          # Read by @oxyhq/core (request hashing).
          APP_IP_HASH_SALT: ${{ secrets.IP_HASH_SALT }}
          APP_DEVICE_ID_SALT: ${{ secrets.DEVICE_ID_SALT }}
        run: |
          sync_secret() {
            name="$1"; value="$2"; path="$3"
            if [ -z "$value" ] || [ "$value" = "-" ]; then
              echo "::warning::skip empty/placeholder secret $name; SSM unchanged"
              return 0
            fi
            aws ssm put-parameter --name "$path" --value "$value" --type SecureString --overwrite >/dev/null
            echo "synced -> $path"
          }

          sync_secret MONGODB_URI "$APP_MONGODB_URI" "/oxy/$APP/MONGODB_URI"
          sync_secret DATABASE_URL "$APP_DATABASE_URL" "/oxy/$APP/DATABASE_URL"
          sync_secret OXY_ACCESS_TOKEN_SECRET "$APP_OXY_ACCESS_TOKEN_SECRET" "/oxy/$APP/OXY_ACCESS_TOKEN_SECRET"
          sync_secret IP_HASH_SALT "$APP_IP_HASH_SALT" "/oxy/$APP/IP_HASH_SALT"
          sync_secret DEVICE_ID_SALT "$APP_DEVICE_ID_SALT" "/oxy/$APP/DEVICE_ID_SALT"

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Build and push (linux/arm64)
        run: |
          IMG=$ECR_REGISTRY/oxy/$APP
          docker build -f "$DOCKERFILE" -t "$IMG:${{ github.sha }}" -t "$IMG:latest" .
          docker push "$IMG:${{ github.sha }}"
          docker push "$IMG:latest"

      # ── Migrations run as one-shot ECS tasks, around the rollout ─────────────
      #
      # Two phases, and the split is the whole point (see @oxyhq/db's phases.ts):
      # `pre` is additive and safe while the OLD image still serves, so it runs
      # BEFORE the service update; `post` drops and narrows, which would break
      # the old image, so it runs AFTER the new one is live. Every migration file
      # declares its own side and the migrator refuses to guess for one that does
      # not.
      #
      # The task REUSES the service's live task definition and network
      # configuration rather than registering its own, which is what gives the
      # migrator the same DATABASE_URL secret, subnets and security groups the
      # service has. Only the command is overridden. That also means it runs the
      # image the task definition points at — the `:latest` tag this workflow
      # just pushed — so `run-task` gets the NEW image without a second revision.
      # If the task definition is ever pinned to an immutable tag, this step must
      # register a revision instead, or it will migrate using the OLD image.
      - name: Resolve the ECS one-shot shape
        id: ecs
        env:
          # Absent on a `push` trigger, where only the default is ever right.
          REQUESTED_PHASE: ${{ github.event.inputs.migration_phase }}
        run: |
          set -euo pipefail
          echo "phase_mode=${REQUESTED_PHASE:-pre-post}" >> "$GITHUB_OUTPUT"

          STATUS=$(aws ecs describe-services --cluster "$CLUSTER" --services "$APP" --query 'services[0].status' --output text 2>/dev/null || echo NONE)
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          if [ "$STATUS" != "ACTIVE" ]; then
            echo "ECS service $APP not created yet — nothing to migrate or deploy against"
            echo "has_database_url=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TD=$(aws ecs describe-services --cluster "$CLUSTER" --services "$APP" --query 'services[0].taskDefinition' --output text)
          NET=$(aws ecs describe-services --cluster "$CLUSTER" --services "$APP" --query 'services[0].networkConfiguration' --output json)
          CONTAINER=$(aws ecs describe-task-definition --task-definition "$TD" --query 'taskDefinition.containerDefinitions[0].name' --output text)
          echo "task_definition=$TD" >> "$GITHUB_OUTPUT"
          echo "container=$CONTAINER" >> "$GITHUB_OUTPUT"
          # JSON on one line: a GITHUB_OUTPUT value cannot span lines unhelped.
          echo "network=$(echo "$NET" | jq -c .)" >> "$GITHUB_OUTPUT"

          # Does the task definition actually inject DATABASE_URL? Asked of the
          # LIVE definition rather than assumed, because the answer is owned by
          # oxy-infra's terraform and not by this repository — and because the
          # failure it prevents is confusing: a migration task with no
          # DATABASE_URL exits non-zero with "Refusing to migrate", which reads
          # like a broken migration rather than a missing secret.
          #
          # Skipping is correct only while NO route reads Postgres: `config.ts`
          # keeps `databaseUrl` optional and nothing calls `connectPostgres()` at
          # boot, so an unapplied migration harms nothing today. This guard
          # RETIRES with that — once `DATABASE_URL` is required at boot, a task
          # definition missing it crash-loops the service, so the state this
          # skips over stops being reachable.
          SECRETS=$(aws ecs describe-task-definition --task-definition "$TD" --query 'taskDefinition.containerDefinitions[0].secrets[].name' --output text)
          if echo "$SECRETS" | tr '\t' '\n' | grep -qx DATABASE_URL; then
            echo "has_database_url=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_database_url=false" >> "$GITHUB_OUTPUT"
            echo "::warning::$TD does not inject DATABASE_URL, so migrations are SKIPPED. The parameter exists at /oxy/$APP/DATABASE_URL; add it to the task definition's secrets[] in oxy-infra (terraform-uswest2) to turn migrations on."
          fi

      # Does this release contain a post-rollout migration at all? Grepped with
      # the pattern @oxyhq/db EXPORTS (`POST_PHASE_GREP_PATTERN`), never a copy —
      # `src/db/__tests__/deployWorkflow.test.ts` asserts this workflow contains
      # that exact string, so the two cannot drift. The grep is sound only
      # because the migrator separately proves every file carries exactly one
      # well-formed marker; without that a typo would read as "no post migration"
      # and the drop would never be applied by anything.
      - name: Detect a post-rollout migration in this release
        id: phases
        run: |
          if grep -rlE '^-- oxy:deploy-phase=post$' packages/backend/src/db/migrations >/dev/null 2>&1; then
            echo "has_post=true" >> "$GITHUB_OUTPUT"
            echo "this release carries at least one post-rollout migration"
          else
            echo "has_post=false" >> "$GITHUB_OUTPUT"
            echo "no post-rollout migration in this release"
          fi

      # The CUTOVER path, chosen by hand from workflow_dispatch. One `all` run
      # applies the whole chain in journal order before the rollout, which the
      # pre/post pair cannot do: a `pre` migration queued behind an unapplied
      # `post` one BLOCKS by design. It is safe only on a database no image is
      # serving yet — which is also why it must never be the default. This is the
      # path the from-zero genesis takes.
      - name: Migrate (all) — cutover only, never a normal release
        if: steps.ecs.outputs.status == 'ACTIVE' && steps.ecs.outputs.has_database_url == 'true' && steps.ecs.outputs.phase_mode == 'all'
        run: .github/scripts/run-migration-task.sh all
        env:
          TASK_DEFINITION: ${{ steps.ecs.outputs.task_definition }}
          CONTAINER_NAME: ${{ steps.ecs.outputs.container }}
          NETWORK_CONFIGURATION: ${{ steps.ecs.outputs.network }}

      - name: Migrate (pre) — before the rollout
        if: steps.ecs.outputs.status == 'ACTIVE' && steps.ecs.outputs.has_database_url == 'true' && steps.ecs.outputs.phase_mode != 'all'
        run: .github/scripts/run-migration-task.sh pre
        env:
          TASK_DEFINITION: ${{ steps.ecs.outputs.task_definition }}
          CONTAINER_NAME: ${{ steps.ecs.outputs.container }}
          NETWORK_CONFIGURATION: ${{ steps.ecs.outputs.network }}

      - name: Deploy to ECS (rolling; skipped until the service exists)
        run: |
          set -euo pipefail

          # Poll the PRIMARY deployment's rolloutState instead of the fixed
          # `aws ecs wait services-stable` waiter (which caps at 10 min and
          # false-fails on a longer rollout + ALB drain).
          MAX_WAIT_SECS=1200   # 20 min hard cap before we call it a real timeout
          POLL_INTERVAL=15     # seconds between describe-services polls

          STATUS=$(aws ecs describe-services --cluster "$CLUSTER" --services "$APP" --query 'services[0].status' --output text 2>/dev/null || echo NONE)
          if [ "$STATUS" != "ACTIVE" ]; then
            echo "ECS service $APP not created yet — image is in ECR, skipping deploy"
            exit 0
          fi

          aws ecs update-service --cluster "$CLUSTER" --service "$APP" --force-new-deployment >/dev/null
          echo "Triggered new deployment for $APP; polling rolloutState (timeout ${MAX_WAIT_SECS}s)..."

          elapsed=0
          while [ "$elapsed" -lt "$MAX_WAIT_SECS" ]; do
            # describe-services must not abort the loop on a transient error (set -e safe).
            DESC=$(aws ecs describe-services \
              --cluster "$CLUSTER" --services "$APP" \
              --query 'services[0].deployments[?status==`PRIMARY`]|[0].[rolloutState,runningCount,desiredCount]' \
              --output text 2>/dev/null) || DESC=""

            if [ -z "$DESC" ] || [ "$DESC" = "None" ]; then
              echo "  ($elapsed s) no PRIMARY deployment info yet, retrying..."
            else
              ROLLOUT_STATE=$(echo "$DESC" | awk '{print $1}')
              RUNNING=$(echo "$DESC" | awk '{print $2}')
              DESIRED=$(echo "$DESC" | awk '{print $3}')
              echo "  ($elapsed s) rolloutState=$ROLLOUT_STATE running=$RUNNING desired=$DESIRED"

              if [ "$ROLLOUT_STATE" = "COMPLETED" ] && [ "$RUNNING" = "$DESIRED" ]; then
                echo "deployed $APP — rollout COMPLETED ($RUNNING/$DESIRED tasks running)"
                exit 0
              fi
              if [ "$ROLLOUT_STATE" = "FAILED" ]; then
                echo "::error::ECS rollout for $APP FAILED — see service events in the AWS console"
                exit 1
              fi
            fi

            sleep "$POLL_INTERVAL"
            elapsed=$((elapsed + POLL_INTERVAL))
          done

          echo "::error::ECS rollout for $APP did not reach COMPLETED within ${MAX_WAIT_SECS}s (genuine timeout)"
          exit 1

      # Only when the release actually has one. Skipping the task entirely is not
      # an optimisation — a `post` run against a database with a pending `pre`
      # migration BLOCKS by design, so running it every time would turn a normal
      # release into a red deploy.
      # Skipped entirely on the cutover path: the `all` run above already applied
      # these, so a `post` here would find nothing — and running it would only
      # add a way for a green cutover to end on a red step.
      - name: Migrate (post) — after the new image is live
        if: >-
          steps.ecs.outputs.status == 'ACTIVE'
          && steps.ecs.outputs.has_database_url == 'true'
          && steps.ecs.outputs.phase_mode != 'all'
          && steps.phases.outputs.has_post == 'true'
        run: .github/scripts/run-migration-task.sh post
        env:
          TASK_DEFINITION: ${{ steps.ecs.outputs.task_definition }}
          CONTAINER_NAME: ${{ steps.ecs.outputs.container }}
          NETWORK_CONFIGURATION: ${{ steps.ecs.outputs.network }}
